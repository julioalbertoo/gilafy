<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="description" content="Gilafy — reproductor del material público y en directo de KGLW (King Gizzard &amp; The Lizard Wizard).">
<title>Gilafy · KGLW</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gilafy">
<link rel="preconnect" href="https://archive.org" crossorigin>
<link rel="dns-prefetch" href="https://archive.org">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- ── Sidebar ───────────────────────────────────────────── -->
  <nav class="sidebar" id="sidebar" aria-label="Navegación principal">
    <div class="sidebar__brand">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" class="brand__mark">
        <circle cx="12" cy="12" r="12" fill="#1ed760"/>
        <path fill="#121212" d="M17.4 10.9c-2.9-1.7-7.7-1.9-10.5-1.1a.85.85 0 1 1-.5-1.63c3.2-.97 8.5-.78 11.8 1.18a.85.85 0 0 1-.87 1.46zm-.1 2.6a.71.71 0 0 1-.97.23c-2.4-1.48-6.07-1.9-8.9-1.04a.71.71 0 1 1-.41-1.36c3.24-.98 7.28-.5 10.05 1.2.33.2.44.64.23.97zm-1.13 2.5a.57.57 0 0 1-.78.19c-2.1-1.29-4.75-1.58-7.87-.86a.57.57 0 0 1-.25-1.1c3.42-.79 6.35-.45 8.71.99.27.16.35.51.19.78z"/>
      </svg>
      <span class="brand__name">Gilafy</span>
    </div>

    <ul class="nav" role="list">
      <li><a class="nav__item" href="#/home" data-route="home">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12.5 3.25a.75.75 0 0 0-1 0l-8.5 7.5A.75.75 0 0 0 3.5 12H5v7.25c0 .41.34.75.75.75h4a.75.75 0 0 0 .75-.75V15h3v4.25c0 .41.34.75.75.75h4a.75.75 0 0 0 .75-.75V12h1.5a.75.75 0 0 0 .5-1.25z"/></svg>
        <span>Inicio</span></a></li>
      <li><a class="nav__item" href="#/search" data-route="search">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25a1 1 0 0 0 1.42-1.42l-4.25-4.24A7.5 7.5 0 0 0 10.5 3m0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11"/></svg>
        <span>Buscar</span></a></li>
      <li><a class="nav__item" href="#/library" data-route="library">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M3 3h2.5v18H3zm4.5 0H10v18H7.5zM13.4 3.9l2.4-.65 4.66 17.4-2.42.65z"/></svg>
        <span>Tu biblioteca</span></a></li>
    </ul>

    <div class="sidebar__panel">
      <div class="panel__head">
        <span class="panel__title">Grabaciones</span>
        <button class="icon-btn icon-btn--sm" id="reloadCatalog" title="Actualizar catálogo" aria-label="Actualizar catálogo">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7"/></svg>
        </button>
      </div>
      <div class="chips" role="list">
        <button class="chip chip--on" data-chip="all" role="listitem">Todo</button>
        <button class="chip" data-chip="liked" role="listitem">Me gusta</button>
        <button class="chip" data-chip="recent" role="listitem">Reciente</button>
      </div>
      <ul class="shelf" id="shelf" role="list"></ul>
    </div>

    <p class="sidebar__legal">
      Audio servido por <strong>Internet Archive</strong> — material que la banda
      autoriza grabar y compartir libremente.
    </p>
  </nav>

  <!-- ── Main ──────────────────────────────────────────────── -->
  <main class="main" id="main">
    <header class="topbar" id="topbar">
      <div class="topbar__nav">
        <button class="icon-btn icon-btn--round" id="navBack" aria-label="Atrás">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M15.3 4.3 7.6 12l7.7 7.7 1.4-1.4-6.3-6.3 6.3-6.3z"/></svg>
        </button>
        <button class="icon-btn icon-btn--round" id="navFwd" aria-label="Adelante">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8.7 4.3 16.4 12l-7.7 7.7-1.4-1.4 6.3-6.3-6.3-6.3z"/></svg>
        </button>
      </div>

      <form class="search" id="searchForm" role="search">
        <svg class="search__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25a1 1 0 0 0 1.42-1.42l-4.25-4.24A7.5 7.5 0 0 0 10.5 3m0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11"/></svg>
        <input class="search__input" id="searchInput" type="search" autocomplete="off"
               placeholder="¿Qué directo quieres escuchar?" aria-label="Buscar grabaciones">
      </form>

      <div class="topbar__right">
        <a class="pill pill--ghost" href="https://archive.org/details/KingGizzardAndTheLizardWizard" target="_blank" rel="noopener noreferrer">Fuente</a>
        <span class="avatar" title="Oyente">KG</span>
      </div>
    </header>

    <div class="view" id="view" tabindex="-1"></div>
  </main>

  <!-- ── Queue drawer ──────────────────────────────────────── -->
  <aside class="queue" id="queue" hidden aria-label="Cola de reproducción">
    <div class="queue__head">
      <h2 class="queue__title">Cola</h2>
      <button class="icon-btn" id="queueClose" aria-label="Cerrar cola">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M6.2 4.8 4.8 6.2 10.6 12l-5.8 5.8 1.4 1.4L12 13.4l5.8 5.8 1.4-1.4-5.8-5.8 5.8-5.8-1.4-1.4L12 10.6z"/></svg>
      </button>
    </div>
    <ol class="queue__list" id="queueList" role="list"></ol>
  </aside>
</div>

<!-- ── Now playing bar ─────────────────────────────────────── -->
<footer class="player" id="player">
  <div class="player__now">
    <img class="np__art" id="npArt" alt="" width="56" height="56">
    <div class="np__meta">
      <span class="np__title" id="npTitle">Nada sonando</span>
      <a class="np__sub" id="npSub" href="#/home">KGLW</a>
    </div>
    <button class="icon-btn icon-btn--like" id="btnLike" aria-label="Añadir a Me gusta" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 20.7 3.9 12.6a5 5 0 1 1 7.1-7.05l1 1 1-1a5 5 0 0 1 7.1 7.06z"/></svg>
    </button>
  </div>

  <div class="player__center">
    <div class="ctrl">
      <button class="icon-btn" id="btnShuffle" aria-label="Aleatorio" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M17 3.5 21.5 8 17 12.5V9.5h-1.9c-1 0-1.6.4-2.4 1.5l-.9 1.3-1.2-1.7.6-.9C12.4 7.9 13.6 7.2 15.1 7.2H17zM2.5 7.2h2.6c1.6 0 2.8.8 3.9 2.4l4 5.8c.8 1.1 1.4 1.5 2.3 1.5H17V14l4.5 4.5L17 23v-3h-1.8c-1.6 0-2.8-.8-3.9-2.4l-4-5.8c-.8-1.1-1.4-1.5-2.3-1.5H2.5z"/></svg>
      </button>
      <button class="icon-btn" id="btnPrev" aria-label="Anterior">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6 5h2v14H6zm12 0v14L8.5 12z"/></svg>
      </button>
      <button class="play-btn" id="btnPlay" aria-label="Reproducir">
        <svg class="ico-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15l12-7.5z"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" hidden><path fill="currentColor" d="M6.5 4.5h4v15h-4zm7 0h4v15h-4z"/></svg>
      </button>
      <button class="icon-btn" id="btnNext" aria-label="Siguiente">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M16 5h2v14h-2zM6 5l9.5 7L6 19z"/></svg>
      </button>
      <button class="icon-btn" id="btnRepeat" aria-label="Repetir" aria-pressed="false" data-mode="off">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 4h10a4 4 0 0 1 4 4v2h-2V8a2 2 0 0 0-2-2H7v2.5L3 5.5 7 2.5zm10 16H7a4 4 0 0 1-4-4v-2h2v2a2 2 0 0 0 2 2h10v-2.5l4 3-4 3z"/></svg>
        <span class="repeat__one" id="repeatOne" hidden>1</span>
      </button>
    </div>

    <div class="bar">
      <span class="bar__time" id="timeNow">0:00</span>
      <div class="range" id="seek" role="slider" tabindex="0" aria-label="Progreso"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="range__track"><div class="range__fill" id="seekFill"></div><div class="range__knob" id="seekKnob"></div></div>
      </div>
      <span class="bar__time" id="timeEnd">0:00</span>
    </div>
  </div>

  <div class="player__right">
    <!-- Play/pausa compacto: sólo visible en móvil, donde .ctrl se oculta -->
    <button class="play-btn mobile-play" id="btnPlayMobile" aria-label="Reproducir">
      <svg class="ico-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15l12-7.5z"/></svg>
      <svg class="ico-pause" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" hidden><path fill="currentColor" d="M6.5 4.5h4v15h-4zm7 0h4v15h-4z"/></svg>
    </button>
    <button class="icon-btn" id="btnQueue" aria-label="Ver cola" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 5h13v2H3zm0 4h13v2H3zm0 4h9v2H3zm0 4h9v2H3zm15-8v7.1a3 3 0 1 0 2 2.83V9h3V7h-5z"/></svg>
    </button>
    <button class="icon-btn" id="btnMute" aria-label="Silenciar">
      <svg class="ico-vol" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9h3.5L12 4.5v15L7.5 15H4zm11.5-.6a5 5 0 0 1 0 7.2l-1.2-1.3a3.2 3.2 0 0 0 0-4.6zM17.8 5.6a8.4 8.4 0 0 1 0 12.8l-1.2-1.35a6.6 6.6 0 0 0 0-10.1z"/></svg>
      <svg class="ico-muted" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" hidden><path fill="currentColor" d="M4 9h3.5L12 4.5v15L7.5 15H4zm11 1.2 1.4-1.4 1.9 1.9 1.9-1.9 1.4 1.4-1.9 1.9 1.9 1.9-1.4 1.4-1.9-1.9-1.9 1.9-1.4-1.4 1.9-1.9z"/></svg>
    </button>
    <div class="range range--vol" id="vol" role="slider" tabindex="0" aria-label="Volumen"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
      <div class="range__track"><div class="range__fill" id="volFill"></div><div class="range__knob" id="volKnob"></div></div>
    </div>
  </div>
</footer>

<!-- Mobile tab bar -->
<nav class="tabbar" aria-label="Navegación móvil">
  <a class="tabbar__item" href="#/home" data-route="home"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12.5 3.25a.75.75 0 0 0-1 0l-8.5 7.5A.75.75 0 0 0 3.5 12H5v7.25c0 .41.34.75.75.75h4a.75.75 0 0 0 .75-.75V15h3v4.25c0 .41.34.75.75.75h4a.75.75 0 0 0 .75-.75V12h1.5a.75.75 0 0 0 .5-1.25z"/></svg><span>Inicio</span></a>
  <a class="tabbar__item" href="#/search" data-route="search"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25a1 1 0 0 0 1.42-1.42l-4.25-4.24A7.5 7.5 0 0 0 10.5 3m0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11"/></svg><span>Buscar</span></a>
  <a class="tabbar__item" href="#/library" data-route="library"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 3h2.5v18H3zm4.5 0H10v18H7.5zM13.4 3.9l2.4-.65 4.66 17.4-2.42.65z"/></svg><span>Biblioteca</span></a>
</nav>

<!-- El único <audio> del documento: nunca se destruye, de modo que la
     reproducción sobrevive a cambios de vista y a la pestaña en segundo plano. -->
<audio id="audio" preload="metadata" playsinline crossorigin="anonymous"></audio>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>

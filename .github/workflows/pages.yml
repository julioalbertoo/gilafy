name: Desplegar Gilafy en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancelamos el que ya esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Requiere que Pages esté activado una vez en
      # Ajustes → Pages → Source: GitHub Actions. `enablement: true` intenta
      # darlo de alta por API, pero GITHUB_TOKEN no siempre puede crear el
      # sitio ("Resource not accessible by integration"); en ese caso el paso
      # de arriba es el que desbloquea el despliegue.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publicamos sólo la app: el arnés de pruebas y los metadatos del
      # repositorio no tienen por qué servirse.
      - name: Preparar la carpeta a publicar
        run: |
          mkdir -p dist
          cp index.html styles.css app.js sw.js manifest.json \
             icon-32.png icon-192.png icon.png icon-maskable.png dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
